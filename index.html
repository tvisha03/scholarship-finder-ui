<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholarship Finder — Discover Your Opportunity</title>
  <meta name="description" content="Find and filter scholarships worldwide. Browse 250+ scholarships by country, stream, level, and deadline." />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
</head>
<body>

  <!-- ===== TOP NAVBAR ===== -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand">
        <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        <span class="brand-text">ScholarFind</span>
      </div>
      <div class="navbar-search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search scholarships, universities, countries..." autocomplete="off" />
      </div>
      <button class="filter-toggle-btn" id="filter-toggle" aria-label="Toggle Filters">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
        <span>Filters</span>
      </button>
    </div>
  </nav>

  <!-- ===== STATS BAR ===== -->
  <section class="stats-bar">
    <div class="stats-inner">
      <div class="stat-card">
        <div class="stat-icon stat-icon-total">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-number" id="stat-total">0</span>
          <span class="stat-label">Scholarships</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-funding">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-number" id="stat-full-funding">0</span>
          <span class="stat-label">Full Funding</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-deadline">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-number" id="stat-deadline">0</span>
          <span class="stat-label">Deadlines This Quarter</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-countries">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-number" id="stat-countries">0</span>
          <span class="stat-label">Countries</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="main-layout">

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ===== LEFT SIDEBAR (FILTERS) ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
          </svg>
          Filters
        </h3>
        <button class="sidebar-close" id="sidebar-close" aria-label="Close Filters">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Country Filter -->
      <div class="filter-group">
        <h4 class="filter-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          Country
        </h4>
        <div class="filter-options">
          <label class="checkbox-label">
            <input type="checkbox" name="country" value="USA" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-flag">🇺🇸</span> USA
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="country" value="UK" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-flag">🇬🇧</span> UK
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="country" value="Canada" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-flag">🇨🇦</span> Canada
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="country" value="Germany" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-flag">🇩🇪</span> Germany
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="country" value="France" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-flag">🇫🇷</span> France
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="country" value="Australia" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-flag">🇦🇺</span> Australia
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="country" value="Netherlands" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-flag">🇳🇱</span> Netherlands
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="country" value="Sweden" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-flag">🇸🇪</span> Sweden
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="country" value="Japan" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-flag">🇯🇵</span> Japan
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="country" value="Switzerland" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-flag">🇨🇭</span> Switzerland
          </label>
        </div>
      </div>

      <!-- Stream Filter -->
      <div class="filter-group">
        <h4 class="filter-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          Stream
        </h4>
        <div class="filter-options">
          <label class="checkbox-label">
            <input type="checkbox" name="stream" value="STEM" />
            <span class="checkbox-custom"></span>
            STEM
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="stream" value="Business" />
            <span class="checkbox-custom"></span>
            Business
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="stream" value="Law" />
            <span class="checkbox-custom"></span>
            Law
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="stream" value="IR" />
            <span class="checkbox-custom"></span>
            International Relations
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="stream" value="Arts" />
            <span class="checkbox-custom"></span>
            Arts & Humanities
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="stream" value="Medicine" />
            <span class="checkbox-custom"></span>
            Medicine
          </label>
        </div>
      </div>

      <!-- Level Filter -->
      <div class="filter-group">
        <h4 class="filter-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
          Education Level
        </h4>
        <div class="filter-options">
          <label class="checkbox-label">
            <input type="checkbox" name="level" value="UG" />
            <span class="checkbox-custom"></span>
            Undergraduate (UG)
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="level" value="PG" />
            <span class="checkbox-custom"></span>
            Postgraduate (PG)
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="level" value="PhD" />
            <span class="checkbox-custom"></span>
            Doctoral (PhD)
          </label>
        </div>
      </div>

      <!-- Deadline Filter -->
      <div class="filter-group">
        <h4 class="filter-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Deadline Before
        </h4>
        <div class="filter-options">
          <input type="date" id="deadline-filter" class="date-input" />
        </div>
      </div>

      <!-- Filter Action Buttons -->
      <div class="filter-actions">
        <button class="btn-apply" id="apply-filters">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Apply Filters
        </button>
        <button class="btn-reset" id="reset-filters">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          Reset
        </button>
      </div>
    </aside>

    <!-- ===== CONTENT AREA ===== -->
    <section class="content">

      <!-- Toolbar: Sort + View Toggle + Result Count -->
      <div class="toolbar">
        <div class="toolbar-left">
          <span class="result-count" id="result-count">Loading...</span>
          <div class="active-filters hidden" id="active-filters"></div>
        </div>
        <div class="toolbar-right">
          <div class="sort-wrapper">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select" class="sort-select">
              <option value="relevance">Relevance</option>
              <option value="amount">Amount (High → Low)</option>
              <option value="deadline">Deadline (Soonest)</option>
            </select>
          </div>
          <div class="view-toggle">
            <button class="view-btn active" id="view-cards" title="Card View">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
              </svg>
            </button>
            <button class="view-btn" id="view-table" title="Table View">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6"/>
                <line x1="8" y1="12" x2="21" y2="12"/>
                <line x1="8" y1="18" x2="21" y2="18"/>
                <line x1="3" y1="6" x2="3.01" y2="6"/>
                <line x1="3" y1="12" x2="3.01" y2="12"/>
                <line x1="3" y1="18" x2="3.01" y2="18"/>
              </svg>
            </button>
            <button class="view-btn" id="view-map" title="Map View">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
                <line x1="8" y1="2" x2="8" y2="18"/>
                <line x1="16" y1="6" x2="16" y2="22"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Scholarship Grid (Card View) -->
      <div class="scholarship-grid" id="scholarship-grid">
        <!-- Cards rendered dynamically -->
      </div>

      <!-- Scholarship Table View -->
      <div class="scholarship-table-container hidden" id="scholarship-table">
        <!-- Table rendered dynamically -->
      </div>

      <!-- Scholarship Map View -->
      <div class="scholarship-map-container hidden" id="scholarship-map">
        <!-- Map rendered dynamically -->
      </div>

      <!-- Load More Button -->
      <div class="load-more-wrapper">
        <button class="btn-load-more" id="load-more-btn">
          Load More <span id="load-more-count"></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p>ScholarFind &copy; 2025 — Built with vanilla HTML, CSS &amp; JavaScript</p>
  </footer>

  <!-- Scripts (order matters: data → storage → filters → render → app) -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
